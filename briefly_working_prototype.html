  const articles = [
    {id:'isro',category:'TECH & AI',title:'ISRO Successfully Deploys Next-Gen NavIC Satellite to Boost Regional GPS Navigation',author:'BriefLy News Desk',time:'May 13, 2024',image:'https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=900&q=80',summary:'The Indian Space Research Organisation has successfully deployed a next-generation NavIC satellite, strengthening regional navigation coverage and reliability.',body:['The Indian Space Research Organisation has announced the successful deployment of a next-generation NavIC satellite, an important step in improving the accuracy and resilience of regional navigation services. The system is designed to expand dependable positioning coverage for users across India and surrounding areas.','The new satellite is expected to support transportation, emergency services, maritime activity and location-aware applications. Engineers will continue system checks and signal validation before the satellite is integrated into regular service.','The deployment reflects a broader effort to build dependable regional infrastructure and make critical navigation services more robust for everyday users.']},
    {id:'ux',category:'DESIGN SYSTEMS',title:'Designing cleaner mobile interfaces',author:'Shea Lewis',time:'3h ago',image:'https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=600&q=80',summary:'Small choices in spacing, typography and navigation can make mobile products easier to understand and more comfortable to use.',body:['Good mobile interfaces make the next step clear. Consistent spacing, strong information hierarchy and familiar interaction patterns help readers scan content without unnecessary effort.','A clean interface does not need to be empty. It needs to give each element a clear purpose, make important actions easy to find, and preserve enough breathing room around text and controls.','For teams refining an existing product, the biggest gains often come from testing real tasks, simplifying repeated interactions and making navigation labels more explicit.']},
    {id:'career',category:'CAREER CRAFT',title:'How to Reboot Your UX/UI Design Job Search?',author:'Lorenzo Perniciaro',time:'7h ago',image:'https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=600&q=80',summary:'A practical guide to refreshing your portfolio, telling a clearer story and focusing your applications.',body:['A focused job search starts with a clear narrative. Show the problem, the decisions you made and the measurable outcome of each project.','Refresh your portfolio around a handful of strong case studies rather than a long list of screenshots. Tailor your introduction to the kinds of teams and problems you want to join.']},
    {id:'clean',category:'INNOVATION',title:"India's Clean Tech Transition Surges 40%",author:'Priya Sharma',time:'5h ago',image:'https://images.unsplash.com/photo-1473341304170-971deb6b4b4b?auto=format&fit=crop&w=600&q=80',summary:'Investment in clean technology is changing how infrastructure and energy projects are planned.',body:['Clean technology is increasingly shaping investment decisions, infrastructure planning and energy policy. The transition depends on better financing, dependable supply chains and skills that support deployment at scale.','The pace of adoption varies by sector, but long-term results will depend on implementation quality as much as on headline investment figures.']},
    {id:'micro',category:'DEEP DIVE',title:'The Micro-Copy Revolution: Words That Delight',author:'Evelyn Vance',time:'12h ago',image:'https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=600&q=80',summary:'Helpful interface language reduces friction by explaining what actions do and what users can expect.',body:['Microcopy is the small layer of language around buttons, forms and system feedback. When written clearly, it reduces uncertainty and helps users make informed decisions.','Useful microcopy is specific, short and consistent. It avoids blame, explains errors in plain language and gives people a practical next step.']},
    {id:'rbi',category:'BUSINESS & MARKETS',title:'RBI repo rate: What the latest decision means',author:'Markets Desk',time:'2h ago',image:'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=600&q=80',summary:'A quick explainer on policy rates, borrowing costs and what to watch in the coming weeks.',body:['The repo rate influences the cost at which banks borrow short-term funds from the Reserve Bank of India. Changes can affect lending rates, deposits and broader financial conditions.','For households, the impact depends on loan type, lender policy and how quickly rate changes pass through to customers. Watch official policy statements alongside inflation and growth data.']}

      sliders:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="#F7F9FF"/><circle cx="15" cy="12" r="2" fill="#F7F9FF"/><circle cx="7" cy="18" r="2" fill="#F7F9FF"/>',
      headphones:'<path d="M3 13v-1a9 9 0 0 1 18 0v1"/><path d="M3 13h4v7H5a2 2 0 0 1-2-2v-5ZM21 13h-4v7h2a2 2 0 0 0 2-2v-5Z"/>',
      zap:'<path d="m13 2-3 8h7l-6 12 2-9H6l7-11Z"/>',
      info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7h.01"/>',
      bookmarkPlus:'<path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-4-6 4V4.5Z"/><path d="M12 7v6M9 10h6"/>',
      arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
      bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',
      book:'<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 0 4 22V4.5Z"/><path d="M4 5v17M8 6h8"/>',
      menu:'<path d="M4 6h16M4 12h16M4 18h16"/>'
    };
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.info}</svg>`;
  }
  function route(screen){state.previousScreen=state.screen;state.screen=screen;render();}
  function showToast(message){const host=$('#toastHost');host.innerHTML=`<div class="toast" role="status">${escapeHtml(message)}</div>`;clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>host.innerHTML='',2300)}
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function getArticle(id=state.articleId){return articles.find(a=>a.id===id)||articles[0]}
  function openArticle(id){state.articleId=id;route('article')}
  function header(title='',opts={}){
    const left=opts.back?`<button class="icon-btn" data-action="back" aria-label="Go back">${icon('back',21)}</button>`:`<div class="brand"><span class="brand-dot"></span><span>BriefLy</span></div>`;
    const right=opts.right||`<span>${escapeHtml(title)}</span>`;
    $('#appbar').innerHTML=`${left}<div class="bar-right">${right}</div>`;
  }
  function nav(){
    const visible=!['splash','language','topics','context'].includes(state.screen);
    $('#bottomNav').style.display=visible?'flex':'none';
    $('#bottomNav').innerHTML=navItems.map(n=>`<button class="nav-item ${((state.screen===n.id)|| (state.screen==='article'&&n.id==='briefs')||(state.screen==='reader'&&n.id==='briefs'))?'active':''}" data-nav="${n.id}" aria-label="${n.label}">${icon(n.icon,18)}<span>${n.label}</span></button>`).join('');
  }
  function heading(title,subtitle='',extra=''){return `<div class="screen-heading"><div class="between"><h1>${title}</h1>${extra}</div>${subtitle?`<p class="subtext">${subtitle}</p>`:''}</div>`}
  function articleCard(a){return `<article class="card article-card" data-article="${a.id}" tabindex="0" role="button" aria-label="Open ${escapeHtml(a.title)}"><div class="article-copy"><div class="between"><span class="category-label">${a.category}</span><span class="tiny">SAMPLE</span></div><h3>${escapeHtml(a.title)}</h3><div class="meta">${escapeHtml(a.author)} &nbsp;·&nbsp; ${escapeHtml(a.time)}</div></div><div class="thumb ${a.id==='ux'?'thumb-ux':''}">${a.id==='ux'?'UX':`<img src="${a.image}" alt="" loading="lazy" onerror="this.style.display='none'">`}</div></article>`}
  function renderSplash(){
    $('#appbar').style.display='none';$('#bottomNav').style.display='none';$('#screen').className='screen-content no-nav splash-screen';
    $('#screen').innerHTML=`<section class="splash"><div class="splash-card"><div class="app-logo"><div class="app-logo-mark"><span></span><span></span><span></span></div></div><div class="brand-word">Brief<span style="color:#D9A900">Ly</span></div><p class="tagline">Sample news in brief. An HCI reading prototype.</p><div class="sample-drop"><div style="color:#785A00">${icon('book',20)}</div><div class="grow"><strong>Sample Edition Drop</strong><small>Why tomorrow's UX trends might matter</small></div><span class="chip yellow">06</span></div><button class="btn btn-primary" data-action="start">Start Reading ${icon('arrow',16)}</button><p class="tiny">Prototype · Demo Reader · Sample news</p></div><div class="footnote">Designed for focused reading, one brief at a time.</div></section>`;
  }
  function renderDiscover(){
    $('#appbar').style.display='flex';header('Discover',{right:`<span>Discover</span><button class="icon-btn" data-action="open-settings" aria-label="Open settings">${icon('user',19)}</button>`});$('#screen').className='screen-content';
    const filtered=articles.filter(a=>state.category==='Trending'?true:state.category==='Popular'?['isro','rbi','ux'].includes(a.id):['clean','micro','career'].includes(a.id));
    $('#screen').innerHTML=`<div class="between" style="margin-bottom:11px"><div><h1>Today Discover</h1><div class="subtext" style="margin-top:5px">May 13, 2024</div></div><span class="chip" style="font-size:9px;color:#A7A9AF">SAMPLE EDITORIAL</span></div>
      <div class="hero-strip" data-article="isro" tabindex="0" role="button" aria-label="Open featured story"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Mountain landscape" onerror="this.style.background='linear-gradient(120deg,#7394A4,#D5B889)'"><button class="play-btn" data-action="play-feature" aria-label="Play featured story">${icon('play',20)}</button><div class="hero-copy"><div><span class="eyebrow" style="color:#FFD94F">● Editorial Highlight</span><strong>Explore stories worth your time</strong></div><span class="chip" style="background:#101720AA;color:white">3 min watch</span></div></div>
      <div class="section-title"><h2>Browse by</h2><button class="icon-btn" data-action="topics" aria-label="Choose topics">${icon('sliders',18)}</button></div>
      <div class="category-tabs" role="tablist">${['Trending','Popular','Newest'].map(c=>`<button class="category-tab ${c===state.category?'active':''}" role="tab" aria-selected="${c===state.category}" data-category="${c}">${c}</button>`).join('')}</div>
      <div>${filtered.map(articleCard).join('')}</div>`;
  }
  function renderSearch(){
    $('#appbar').style.display='flex';header('Search');$('#screen').className='screen-content';
    const q=state.query.toLowerCase();const results=articles.filter(a=>(a.title+' '+a.summary+' '+a.category).toLowerCase().includes(q)||q==='');
    $('#screen').innerHTML=`<form id="searchForm" class="searchbox"><span style="color:var(--muted)">${icon('search',17)}</span><input id="searchInput" name="q" aria-label="Search news" placeholder="Search briefs, topics or keywords" value="${escapeHtml(state.query)}"><button type="button" data-action="clear-search" aria-label="Clear search">${icon('close',15)}</button><button class="submit-search" type="submit" aria-label="Submit search">${icon('arrow',16)}</button></form>
      <div class="pill-row" style="margin-top:14px"><button class="chip selected" data-filter="All">All <b>142</b></button><button class="chip outline" data-filter="Fact-Checked">${icon('check',13)} Fact-Checked</button><button class="chip outline" data-filter="Audio Briefs">${icon('headphones',13)} Audio Briefs</button></div>
      <div class="section-title"><span class="eyebrow" style="color:var(--body)">Recent queries</span><button class="text-link" data-action="clear-recent">Clear</button></div>
      <div class="pill-row" style="flex-wrap:wrap">${state.recent.map(r=>`<button class="recent-chip" data-recent="${escapeHtml(r)}">${icon('clock',12)} ${escapeHtml(r)}</button>`).join('')}</div>
      <div class="section-title"><h2>${q?'Search results':'Suggested briefs'}</h2><span class="tiny">${results.length} found</span></div>
      ${results.length ? results.map(a=>`<div class="result-item" data-article="${a.id}" tabindex="0" role="button"><div class="between"><span class="category-label">${a.category}</span><span class="tiny">${a.time}</span></div><h3>${escapeHtml(a.title)}</h3><p>${escapeHtml(a.summary)}</p></div>`).join('') : `<div class="empty"><div class="empty-icon">${icon('search',22)}</div>No matching sample briefs. Try “UX”, “RBI” or “NavIC”.</div>`}`;
  }
  function renderVault(){
    $('#appbar').style.display='flex';header('Reading Vault',{right:`<button class="icon-btn" data-action="vault-search" aria-label="Search saved stories">${icon('search',18)}</button>`});$('#screen').className='screen-content';
    const saved=state.saved.map(id=>getArticle(id)).filter(Boolean);
    $('#screen').innerHTML=`<div class="between"><div><h1>Reading Vault</h1><div class="subtext" style="margin-top:4px">Local Save · Zero Distraction</div></div><span class="chip yellow">${saved.length} saved</span></div>
      <div class="feature-box"><div class="between"><div class="row"><div class="avatar">MN</div><div><h3>BriefLy Pro Reader</h3><div class="meta"><span class="status-dot"></span>Offline reading enabled</div></div></div><span class="chip">Active</span></div></div>
      <div class="category-tabs"><button class="category-tab active">All Saved</button><button class="category-tab" data-action="show-bookmarks">Bookmarks</button><button class="category-tab" data-action="show-history">Recently Read</button></div>
      <div class="section-title"><h2>Archived Briefs</h2><span class="tiny">Saved on this device</span></div>
      ${saved.length?saved.map(articleCard).join(''):`<div class="empty"><div class="empty-icon">${icon('bookmark',22)}</div><strong>No saved briefs yet</strong><p style="margin-top:5px">Open a story and tap Save Brief to keep it here for later.</p><button class="btn btn-light btn-sm" style="margin-top:12px" data-nav="discover">Explore stories</button></div>`}`;
  }
  function toggleRow(key,label,description,iconName){return `<div class="setting-row"><div class="setting-icon">${icon(iconName,18)}</div><div class="grow"><h3>${label}</h3><div class="meta">${description}</div></div><button class="toggle" role="switch" aria-checked="${!!state.toggles[key]}" data-toggle="${key}" aria-label="Toggle ${label}"><span></span></button></div>`}
  function renderSettings(){
    $('#appbar').style.display='flex';header('Settings',{right:`<span class="chip">BriefLy ED. 01</span>`});$('#screen').className='screen-content';
    $('#screen').innerHTML=`<div class="between"><div><h1>Settings</h1><p class="subtext" style="margin-top:4px">Personalise your reading experience</p></div><div class="avatar">MN</div></div>
      <div class="feature-box"><div class="row"><div class="avatar">MN</div><div class="grow"><h3>Member name</h3><div style="color:var(--yellow-dark);font-size:11px;font-weight:700;margin-top:2px">BriefLy Pro Reader</div><div class="meta">On-device profile · Active</div></div><button class="icon-btn" data-action="profile-edit" aria-label="Edit profile">${icon('chevron',18)}</button></div></div>
      <div class="section-title"><h2>Reading Experience & Pacing</h2><span class="chip yellow">Personal</span></div>
      <div class="card card-pad">${toggleRow('web','Web News','Show source links with each brief','globe')}${toggleRow('ticker','Ticker','Compact headline ticker','zap')}${toggleRow('audio','Audio Wire','Offer audio narration for briefs','headphones')}</div>
      <div class="section-title"><h2>Edition & Language</h2></div>
      <button class="card setting-row" style="width:100%;padding:12px;text-align:left" data-action="language"><div class="setting-icon">${icon('globe',18)}</div><div class="grow"><h3>Choose your edition</h3><div class="meta">Current language: ${escapeHtml(state.language)}</div></div>${icon('chevron',17)}</button>
      <button class="card setting-row" style="width:100%;padding:12px;text-align:left;margin-top:9px" data-action="topics"><div class="setting-icon">${icon('sliders',18)}</div><div class="grow"><h3>Curate your wire</h3><div class="meta">${state.topics.size} topics selected</div></div>${icon('chevron',17)}</button>
      <div class="section-title"><h2>Notifications</h2></div><div class="card card-pad">${toggleRow('notifications','Daily Brief Drop','A small digest when new briefs arrive','bell')}</div>
      <div class="section-title"><h2>About</h2></div><div class="card card-pad"><div class="between"><span class="meta">BriefLy HCI Prototype</span><span class="tiny">Version 1.0.0</span></div></div>`;
  }
  function renderLanguage(){
    $('#appbar').style.display='flex';header('Choose Your Edition',{back:true,right:`<span class="progress-label">STEP 1 OF 2</span>`});$('#screen').className='screen-content with-action';
    $('#screen').innerHTML=`<div class="backline"><span class="chip yellow">${icon('globe',13)} EDITION SETUP</span></div>${heading('Choose Your Edition','Select your primary language. You can change this later in Settings.')}<div class="progress-track"><span></span></div><div class="eyebrow" style="color:var(--body);margin-bottom:10px">Available languages</div>${languages.map(l=>`<button class="language-option ${state.language===l.name?'selected':''}" data-language="${l.name}"><span class="language-badge">${l.code}</span><span class="grow"><strong style="display:block;font-size:13px">${l.name} <span style="font-weight:400;color:var(--body)">${l.native!==l.name?`· ${l.native}`:''}</span></strong><span class="meta">${l.subtitle}</span></span><span class="selected-mark">${icon('check',14)}</span></button>`).join('')}`;
    $('#fixedAction')?.remove();$('#device').insertAdjacentHTML('beforeend',`<div class="fixed-action" id="fixedAction"><button class="btn btn-primary btn-block" data-action="language-next">Continue to Topics ${icon('arrow',16)}</button><p>Your selection personalises the stories shown in your feed.</p></div>`);
  }
  function renderTopics(){
    $('#appbar').style.display='flex';header('Curate Your Wire',{back:true,right:`<span class="progress-label">STEP 2 OF 2 · TOPICS</span>`});$('#screen').className='screen-content with-action';
    $('#screen').innerHTML=`<div class="backline"><span class="chip yellow">${icon('sliders',13)} YOUR FEED</span></div>${heading('Curate Your Wire','Select at least 3 topics to calibrate your personalised, low-noise feed.')}<div class="progress-track"><span style="width:100%"></span></div><div class="between" style="margin-bottom:10px"><span class="eyebrow" style="color:var(--body)">Available channels</span><button class="text-link" data-action="select-all">Select all</button></div>${topics.map((t,i)=>`<button class="topic-option ${state.topics.has(t)?'selected':''}" data-topic="${escapeHtml(t)}"><span class="setting-icon">${icon(['newspaper','globe','zap','arrow','compass','sliders','info','book'][i],17)}</span><span class="grow"><strong style="font-size:12px;display:block">${t}</strong><span class="meta">${['Policy, government and public affairs','Economy, companies and markets','Products, AI and emerging technology','Founders, funding and new ventures','Culture, sport and global moments','Energy systems and climate policy','Research and wellbeing updates','Design, creativity and innovation'][i]}</span></span><span class="selected-mark">${icon('check',14)}</span></button>`).join('')}`;
    $('#fixedAction')?.remove();$('#device').insertAdjacentHTML('beforeend',`<div class="fixed-action" id="fixedAction"><button class="btn btn-primary btn-block" data-action="finish-topics">Enter Feed (${state.topics.size} Selected) ${icon('arrow',16)}</button><p>Choose 3 or more topics to continue.</p></div>`);
  }
  function renderReader(){
    state.articleId='isro';
    const a=getArticle('isro');$('#appbar').style.display='flex';header('Curated Briefs',{back:true,right:`<span class="chip yellow">SAMPLE NEWS</span><button class="icon-btn" data-action="save-current" aria-label="Save story">${icon('bookmark',18)}</button>`});$('#screen').className='screen-content';
    $('#screen').innerHTML=`<div class="between"><span class="eyebrow">${a.category}</span><span class="tiny">May 13, 2024</span></div><h1 class="story-title">${a.title}</h1><div class="source-line"><span class="source-mark">B</span><span><strong style="color:var(--ink)">BriefLy News Desk</strong><br>3 min read · Sample editorial</span><span style="margin-left:auto" class="chip yellow">Fact-checked</span></div><img class="story-image" src="${a.image}" alt="Satellite and Earth" onerror="this.style.display='none'"><div class="story-body"><p>${a.body[0]}</p><p>${a.body[1]}</p><div class="feature-box" style="margin:14px 0"><div class="eyebrow">The takeaway</div><p style="margin:6px 0 0;font-weight:650;color:var(--ink)">A stronger regional navigation system can support everyday services and critical infrastructure.</p></div><p>${a.body[2]}</p></div><div class="action-row"><button class="btn btn-outline" data-action="save-current">${icon('bookmark',16)} Save Brief</button><button class="btn btn-primary" data-action="read-full">Read Full Story ${icon('arrow',15)}</button></div><button class="text-link" data-action="context">${icon('info',14)} View sample article context</button>`;
  }
  function renderArticle(){
    const a=getArticle();$('#appbar').style.display='flex';header('Briefly Story',{back:true,right:`<button class="icon-btn" data-action="save-current" aria-label="Save story">${icon('bookmark',18)}</button><button class="icon-btn" data-action="context" aria-label="View article context">${icon('info',18)}</button>`});$('#screen').className='screen-content';
    $('#screen').innerHTML=`<div class="backline"><button class="text-link" style="padding-left:0" data-action="back-story">${icon('back',14)} Back to story</button><span class="tiny" style="margin-left:auto">HCI Reading Study · Design Card Hero</span></div><div class="thumb thumb-ux" style="width:100%;height:135px;border-radius:18px;font-size:27px">${a.id==='ux'?'UX':`<img style="width:100%;height:100%;object-fit:cover" src="${a.image}" alt="" onerror="this.style.display='none'">`}</div><div class="eyebrow" style="margin-top:14px">${a.category}</div><h1 class="story-title">${a.id==='ux'?'Designing cleaner mobile interfaces':a.title}</h1><div class="source-line"><span class="source-mark">${a.author.charAt(0)}</span><span><strong style="color:var(--ink)">${escapeHtml(a.author)}</strong><br>${a.time} · 4 min read</span></div><div class="divider"></div><div class="story-body"><p>${a.summary}</p>${a.body.map(p=>`<p>${p}</p>`).join('')}<p>In this prototype, the focus is on scannability, readable line lengths, clear section labels and predictable navigation. A consistent visual system helps each new screen feel familiar without hiding useful content.</p></div><div class="action-row"><button class="btn btn-outline" data-action="save-current">${icon('bookmark',16)} Save Brief</button><button class="btn btn-light" data-action="context">${icon('info',16)} Article context</button></div>`;
  }
  function renderContext(){
    const a=getArticle();$('#appbar').style.display='flex';header('Article Context',{back:true,right:`<button class="icon-btn" data-action="context-close" aria-label="Close context">${icon('close',18)}</button>`});$('#screen').className='screen-content with-action';
    $('#screen').innerHTML=`<div class="backline"><span class="chip yellow">${icon('info',13)} SAMPLE ARTICLE</span></div><h2 style="margin-bottom:14px">Sample Article Context</h2><div class="context-panel"><div class="eyebrow" style="margin-bottom:9px">Briefing Background</div><p>${escapeHtml(a.summary)} This context is provided to help readers understand why the story matters and how it relates to the selected topic.</p></div><div class="context-panel"><div class="eyebrow" style="margin-bottom:9px">Sample Scope Note</div><p>In this prototype demonstration, story context stays separate from the main article so readers can review background information without losing their place. References and source notes can be added here in a production version.</p></div><div class="context-panel"><div class="eyebrow" style="margin-bottom:9px">Reading intent</div><p>Use this space for source notes, definitions, methodology or editorial caveats connected to the current brief.</p></div>`;
    $('#fixedAction')?.remove();$('#device').insertAdjacentHTML('beforeend',`<div class="fixed-action two" id="fixedAction"><button class="btn btn-primary" data-action="save-current">${icon('bookmark',15)} Save Brief</button><button class="btn btn-outline" data-action="context-close">Close Sheet</button></div>`);
  }
  function render(){
    $('#toastHost').innerHTML='';$('#fixedAction')?.remove();
    if(state.screen!=='splash'){$('#appbar').style.display='flex'}
    nav();
    switch(state.screen){case'splash':renderSplash();break;case'discover':renderDiscover();break;case'search':renderSearch();break;case'vault':renderVault();break;case'settings':renderSettings();break;case'language':renderLanguage();break;case'topics':renderTopics();break;case'reader':renderReader();break;case'article':renderArticle();break;case'context':renderContext();break;default:state.screen='discover';renderDiscover();}
    if(state.screen==='splash')$('#appbar').style.display='none';
    if(!['splash','language','topics','context'].includes(state.screen))$('#fixedAction')?.remove();
    $('#screen').scrollTop=0;
  }
  function saveCurrent(){const id=state.articleId==='isro'&&state.screen==='reader'?'isro':state.articleId;if(!state.saved.includes(id)){state.saved.unshift(id);showToast('Brief saved to your Reading Vault.')}else{showToast('This brief is already in your vault.')} }
  function back(){
    const map={language:'settings',topics:'language',context:'article',article:'reader',reader:'discover',search:'discover',vault:'discover',settings:'discover',discover:'splash'};
    route(map[state.screen]||'discover');
  }
  $('#device').addEventListener('click',e=>{
    const navBtn=e.target.closest('[data-nav]');if(navBtn){const target=navBtn.dataset.nav;if(target==='briefs')route('reader');else route(target);return;}
    if(e.target.closest('[data-action="play-feature"]')){route('reader');return;}
    const articleEl=e.target.closest('[data-article]');if(articleEl){openArticle(articleEl.dataset.article);return;}
    const category=e.target.closest('[data-category]');if(category){state.category=category.dataset.category;renderDiscover();return;}
    const recent=e.target.closest('[data-recent]');if(recent){state.query=recent.dataset.recent;state.recent=[state.query,...state.recent.filter(x=>x!==state.query)].slice(0,5);renderSearch();return;}
    const language=e.target.closest('[data-language]');if(language){state.language=language.dataset.language;renderLanguage();return;}
    const topic=e.target.closest('[data-topic]');if(topic){const t=topic.dataset.topic;if(state.topics.has(t))state.topics.delete(t);else state.topics.add(t);renderTopics();return;}
    const toggle=e.target.closest('[data-toggle]');if(toggle){const k=toggle.dataset.toggle;state.toggles[k]=!state.toggles[k];renderSettings();showToast(`${k==='web'?'Web News':k==='ticker'?'Ticker':k==='audio'?'Audio Wire':'Notifications'} ${state.toggles[k]?'enabled':'disabled'}.`);return;}
    const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
    switch(action){
      case'start':route('discover');break;
      case'back':back();break;
      case'open-settings':route('settings');break;
      case'topics':route('topics');break;
      case'language':route('language');break;
      case'language-next':route('topics');break;
      case'finish-topics':if(state.topics.size<3){showToast('Please select at least 3 topics.');break;}route('discover');showToast('Your feed has been personalised.');break;
      case'select-all':topics.forEach(t=>state.topics.add(t));renderTopics();break;
      case'save-current':saveCurrent();if(state.screen==='context'){route('vault');}break;
      case'read-full':openArticle('isro');break;
      case'context':route('context');break;
      case'context-close':route('article');break;
      case'back-story':route('reader');break;
      case'clear-search':state.query='';renderSearch();$('#searchInput')?.focus();break;
      case'clear-recent':state.recent=[];renderSearch();break;
      case'vault-search':route('search');break;
      case'show-bookmarks':showToast('All saved briefs are shown in this prototype.');break;
      case'show-history':showToast('Recently read stories are included in the sample feed.');break;
      case'profile-edit':showToast('Profile editing is a placeholder in this HCI prototype.');break;
      case'play-feature':openArticle('isro');break;
    }
  });
  $('#device').addEventListener('submit',e=>{
    if(e.target.id==='searchForm'){
      e.preventDefault();const input=$('#searchInput');state.query=input.value.trim();if(state.query&&!state.recent.includes(state.query))state.recent.unshift(state.query);state.recent=state.recent.slice(0,5);renderSearch();
    }
  });
  $('#device').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-article]')){e.preventDefault();openArticle(e.target.dataset.article);}});
  render();
})();
</script>
</body>
</html>
